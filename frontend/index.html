<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChangeLoop — Resource Decision Intelligence</title>
<meta name="description" content="ChangeLoop prices the downstream zero-liquid-discharge consequence into the upstream dyehouse scheduling decision.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="masthead">
  <div class="mast-brand">
    <svg class="mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <!-- a loop that does not quite close: water returns, salt accumulates -->
      <circle cx="13" cy="13" r="10.5" fill="none" stroke="currentColor"
              stroke-width="1.4" stroke-dasharray="52 14" opacity=".45"/>
      <circle cx="13" cy="13" r="5.5" fill="none" stroke="currentColor"
              stroke-width="1.4"/>
      <circle cx="13" cy="2.5" r="2.1" fill="currentColor"/>
    </svg>
    <div>
      <div class="mast-name">ChangeLoop</div>
      <div class="mast-sub">Resource Decision Intelligence</div>
    </div>
  </div>

  <div class="mast-fields">
    <div class="mast-field">
      <label for="siteSelect">Site</label>
      <select id="siteSelect" aria-label="Production site"></select>
    </div>
    <div class="mast-field">
      <label for="modeSelect">Binding constraint</label>
      <select id="modeSelect" aria-label="Operating constraint mode"></select>
    </div>
    <div class="mast-field">
      <label>Evidence basis</label>
      <span class="ev ev-MODELLED">MODELLED &middot; NO METERED DATA</span>
    </div>
  </div>

  <div class="mast-actions">
    <button class="btn btn-sm btn-ghost" id="themeBtn">
      <span id="themeLabel">Dark</span>
    </button>
    <button class="btn btn-sm" id="resetBtn">Reset session</button>
  </div>
</header>

<div class="shell">
  <nav class="rail" aria-label="Sections">
    <div class="rail-head">Contents</div>
    <div class="rail-nav" id="railNav"></div>
    <div class="rail-foot">
      <p class="advisory-note">
        <strong>Advisory only.</strong> ChangeLoop issues no setpoints and
        cannot release a bath. Every action needs a named human decision, and
        refusals are recorded alongside approvals.
      </p>
    </div>
  </nav>

  <main class="work" id="main" tabindex="-1">
    <div id="view">
      <div class="sec-body">
        <div class="state-msg"><span class="spinner"></span>Loading engine state&hellip;</div>
      </div>
    </div>
  </main>
</div>

<dialog class="sheet" id="sheet">
  <div class="sheet-head">
    <h2 class="sheet-title" id="sheetTitle">Detail</h2>
    <button class="btn btn-sm btn-ghost" id="sheetClose">Close</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/frontend/app.js"></script>
</body>
</html>
